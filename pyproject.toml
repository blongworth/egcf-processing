[project]
name = "egcf-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.9",
]

[project.scripts]
egcf-process = "egcf_processing.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egcf_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
